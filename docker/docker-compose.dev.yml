name: studyhub-dev
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      MARIADB_HOST: localhost
      FLASK_DEBUG: "1"
    expose: ["5000"]
    volumes:
      - ../:/workspace
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    env_file: ../.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  nginx:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]
volumes:
  db_data:
